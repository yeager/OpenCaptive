# DOSBox-X profile for authentic Captive VGA verification.
# Keep this profile separate from the user's global DOSBox-X preferences.

[sdl]
fullscreen=false
windowresolution=640x400
output=surface
autolock=true
usescancodes=true
mouse emulation=integration

[dosbox]
machine=vgaonly
memsize=16
int33=true
int33 max x=320
int33 max y=200

[cpu]
integration device=true
core=normal
cycles=3000
cycleup=500
cycledown=500

[render]
frameskip=0
aspect=false
scaler=normal2x

[video]
memory io optimization 1=false

[log]
# The user's global DOSBox-X preferences may select debugger startup. The
# normal OpenCaptive handoff must run the original CAPPO loop unlocked;
# debugger mode remains reserved for the explicit expect-based diagnostics.
debuggerrun=normal

[autoexec]
@echo off

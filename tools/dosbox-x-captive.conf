# DOSBox-X profile for authentic Captive VGA verification.
# Keep this profile separate from the user's global DOSBox-X preferences.

[sdl]
fullscreen=false
windowresolution=640x400
output=surface
autolock=true
usescancodes=true

[dosbox]
machine=vgaonly
memsize=16
integration device=true

[render]
frameskip=0
aspect=false
scaler=normal2x

[video]
memory io optimization 1=false

[cpu]
core=normal
cycles=3000
cycleup=500
cycledown=500

[autoexec]
@echo off

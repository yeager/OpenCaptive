# DOSBox-X profile for authentic Captive VGA verification.
# Keep this profile separate from the user's global DOSBox-X preferences.

[sdl]
fullscreen=false
windowresolution=640x400
output=surface
autolock=true
usescancodes=true
# CAPPO draws and polls its own INT 33 cursor while the DOSBox-X window is
# captured.  Integration-only emulation runs only while the mouse is *not*
# locked, so the original game cursor stops receiving motion after the first
# click.  Keep the original cursor fed while the window is locked.
mouse emulation=locked

[dosbox]
machine=vgaonly
memsize=16
int33=true
int33 max x=320
int33 max y=200
# Do not let a stale macOS quit-warning modal block the authentic startup
# window. This changes only window-close confirmation; CAPTIVE.BAT, CAPPO,
# input, timing, VGA and original game data remain unchanged.
quit warning=false

[cpu]
integration device=true
core=normal
cycles=3000
cycleup=500
cycledown=500

[render]
frameskip=0
aspect=false
scaler=normal2x

[video]
memory io optimization 1=false

[log]
# The user's global DOSBox-X preferences may select debugger startup. The
# normal OpenCaptive handoff must run the original CAPPO loop unlocked;
# debugger mode remains reserved for the explicit expect-based diagnostics.
debuggerrun=normal

[autoexec]
@echo off

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v, for example 2.7.5'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build rpm librsvg2-bin zlib1g-dev \
            libfreetype-dev libharfbuzz-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdecor-0-dev libegl-dev libgles-dev libgl-dev libdrm-dev \
            libgbm-dev libpulse-dev libasound2-dev
      - name: Build SDL3
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL3-src
          cmake -S SDL3-src -B SDL3-build -DCMAKE_INSTALL_PREFIX=/usr/local -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C SDL3-build
          sudo ninja -C SDL3-build install
          sudo ldconfig
      - name: Build SDL3_ttf
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/libsdl-org/SDL_ttf.git SDL3_ttf-src
          cmake -S SDL3_ttf-src -B SDL3_ttf-build -DCMAKE_INSTALL_PREFIX=/usr/local -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C SDL3_ttf-build
          sudo ninja -C SDL3_ttf-build install
          sudo ldconfig
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=cc -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure -E "map_gen|captive_view_window|liberation_text_table|liberation_x3g|liberation_img|custom_features|game_state|save_load"
      - name: Get version
        id: version
        run: echo "version=${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Package tar.gz
        run: |
          mkdir -p opencaptive-linux-x86_64/data opencaptive-linux-x86_64/po opencaptive-linux-x86_64/assets
          cp build/opencaptive opencaptive-linux-x86_64/
          cp data/DejaVuSansMono-Bold.ttf opencaptive-linux-x86_64/data/
          cp -R assets/menu opencaptive-linux-x86_64/assets/
          cp po/*.po opencaptive-linux-x86_64/po/
          cp README.md LICENSE opencaptive-linux-x86_64/
          tar czf opencaptive-linux-x86_64.tar.gz opencaptive-linux-x86_64/
      - name: Generate icons
        run: |
          for size in 16 32 48 64 128 256 512; do
            mkdir -p icons/hicolor/${size}x${size}/apps
            rsvg-convert -w $size -h $size assets/icon.svg -o icons/hicolor/${size}x${size}/apps/opencaptive.png
          done
      - name: Build deb
        run: |
          PKG_VERSION=${{ steps.version.outputs.version }}
          mkdir -p deb/DEBIAN
          mkdir -p deb/usr/bin
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/doc/opencaptive
          mkdir -p deb/usr/share/opencaptive/data
          mkdir -p deb/usr/share/opencaptive/po
          mkdir -p deb/usr/share/opencaptive/assets
          cp build/opencaptive deb/usr/bin/
          cp data/DejaVuSansMono-Bold.ttf deb/usr/share/opencaptive/data/
          cp -R assets/menu deb/usr/share/opencaptive/assets/
          cp po/*.po deb/usr/share/opencaptive/po/
          cp README.md LICENSE deb/usr/share/doc/opencaptive/
          mkdir -p deb/usr/share/icons
          cp -r icons/hicolor deb/usr/share/icons/hicolor
          printf '%s\n' '[Desktop Entry]' 'Name=OpenCaptive' 'Comment=Reimplementation of Captive and Liberation: Captive 2' 'Exec=opencaptive' 'Icon=opencaptive' 'Type=Application' 'Categories=Game;ActionGame;' > deb/usr/share/applications/opencaptive.desktop
          printf '%s\n' "Package: opencaptive" "Version: ${PKG_VERSION}" "Section: games" "Priority: optional" "Architecture: amd64" "Maintainer: Daniel Nylander <daniel@danielnylander.se>" "Homepage: https://github.com/yeager/OpenCaptive" "Description: Reimplementation of Captive and Liberation: Captive 2" " A modern C/SDL3 reimplementation of the classic sci-fi dungeon" " crawlers Captive (1990) and Liberation: Captive 2 (1993)." > deb/DEBIAN/control
          dpkg-deb --build deb opencaptive_${PKG_VERSION}_amd64.deb
      - name: Build rpm
        run: |
          PKG_VERSION=${{ steps.version.outputs.version }}
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p rpmbuild/SOURCES/opencaptive-${PKG_VERSION}
          cp build/opencaptive rpmbuild/SOURCES/opencaptive-${PKG_VERSION}/
          cp README.md LICENSE rpmbuild/SOURCES/opencaptive-${PKG_VERSION}/
          mkdir -p rpmbuild/SOURCES/opencaptive-${PKG_VERSION}/data
          mkdir -p rpmbuild/SOURCES/opencaptive-${PKG_VERSION}/po
          mkdir -p rpmbuild/SOURCES/opencaptive-${PKG_VERSION}/assets
          cp data/DejaVuSansMono-Bold.ttf rpmbuild/SOURCES/opencaptive-${PKG_VERSION}/data/
          cp po/*.po rpmbuild/SOURCES/opencaptive-${PKG_VERSION}/po/
          cp -R assets/menu rpmbuild/SOURCES/opencaptive-${PKG_VERSION}/assets/
          tar czf rpmbuild/SOURCES/opencaptive-${PKG_VERSION}.tar.gz \
            -C rpmbuild/SOURCES opencaptive-${PKG_VERSION}
          printf '%s\n' \
            "Name:           opencaptive" \
            "Version:        ${PKG_VERSION}" \
            "Release:        1" \
            "Summary:        Reimplementation of Captive and Liberation: Captive 2" \
            "License:        MIT" \
            "URL:            https://github.com/yeager/OpenCaptive" \
            "Source0:        opencaptive-${PKG_VERSION}.tar.gz" \
            "" \
            "%description" \
            "A modern C/SDL3 reimplementation of the classic sci-fi dungeon" \
            "crawlers Captive (1990) and Liberation: Captive 2 (1993)." \
            "" \
            "%prep" \
            "%setup -q" \
            "" \
            "%install" \
            "mkdir -p %{buildroot}/usr/bin" \
            "cp opencaptive %{buildroot}/usr/bin/" \
            "mkdir -p %{buildroot}/usr/share/opencaptive/data" \
            "mkdir -p %{buildroot}/usr/share/opencaptive/po" \
            "mkdir -p %{buildroot}/usr/share/opencaptive/assets" \
            "cp data/DejaVuSansMono-Bold.ttf %{buildroot}/usr/share/opencaptive/data/" \
            "cp po/*.po %{buildroot}/usr/share/opencaptive/po/" \
            "cp -R assets/menu %{buildroot}/usr/share/opencaptive/assets/" \
            "mkdir -p %{buildroot}/usr/share/doc/opencaptive" \
            "cp README.md LICENSE %{buildroot}/usr/share/doc/opencaptive/" \
            "" \
            "%files" \
            "/usr/bin/opencaptive" \
            "/usr/share/opencaptive/data/DejaVuSansMono-Bold.ttf" \
            "/usr/share/opencaptive/po/*" \
            "/usr/share/opencaptive/assets/menu/*" \
            "/usr/share/doc/opencaptive/README.md" \
            "/usr/share/doc/opencaptive/LICENSE" \
            > rpmbuild/SPECS/opencaptive.spec
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/opencaptive.spec
          cp rpmbuild/RPMS/x86_64/*.rpm opencaptive-${PKG_VERSION}.x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            opencaptive-linux-x86_64.tar.gz
            opencaptive_*.deb
            opencaptive-*.rpm

  build-linux-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file libfuse2 librsvg2-bin zlib1g-dev \
            libfreetype-dev libharfbuzz-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdecor-0-dev libegl-dev libgles-dev libgl-dev libdrm-dev \
            libgbm-dev libpulse-dev libasound2-dev
      - name: Build SDL3
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL3-src
          cmake -S SDL3-src -B SDL3-build -DCMAKE_INSTALL_PREFIX=/usr -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C SDL3-build
          sudo ninja -C SDL3-build install
          sudo ldconfig
      - name: Build SDL3_ttf
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/libsdl-org/SDL_ttf.git SDL3_ttf-src
          cmake -S SDL3_ttf-src -B SDL3_ttf-build -DCMAKE_INSTALL_PREFIX=/usr -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C SDL3_ttf-build
          sudo ninja -C SDL3_ttf-build install
          sudo ldconfig
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=cc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          ninja -C build
      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/opencaptive/data AppDir/usr/share/opencaptive/po AppDir/usr/share/opencaptive/assets
          cp build/opencaptive AppDir/usr/bin/
          cp data/DejaVuSansMono-Bold.ttf AppDir/usr/share/opencaptive/data/
          cp po/*.po AppDir/usr/share/opencaptive/po/
          cp -R assets/menu AppDir/usr/share/opencaptive/assets/
          printf '%s\n' '[Desktop Entry]' 'Name=OpenCaptive' 'Exec=opencaptive' 'Icon=opencaptive' 'Type=Application' 'Categories=Game;' > AppDir/usr/share/applications/opencaptive.desktop
          rsvg-convert -w 256 -h 256 assets/icon.svg -o AppDir/usr/share/icons/hicolor/256x256/apps/opencaptive.png
      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv OpenCaptive-*.AppImage opencaptive-x86_64.AppImage 2>/dev/null || \
            mv *.AppImage opencaptive-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: opencaptive-x86_64.AppImage
        if: ${{ hashFiles('opencaptive-x86_64.AppImage') != '' }}

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install cmake ninja sdl3 sdl3_ttf librsvg
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=cc -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure -E "liberation_img|liberation_x3g"
      - name: Create app bundle
        run: |
          APP=OpenCaptive.app
          VERSION=${RELEASE_VERSION#v}
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Frameworks"
          mkdir -p "$APP/Contents/Resources/data"
          mkdir -p "$APP/Contents/Resources/po"
          mkdir -p "$APP/Contents/Resources/assets"
          cp assets/icon.icns "$APP/Contents/Resources/OpenCaptive.icns"
          cp build/opencaptive "$APP/Contents/MacOS/OpenCaptive"
          cp data/DejaVuSansMono-Bold.ttf "$APP/Contents/Resources/data/"
          cp -R assets/menu "$APP/Contents/Resources/assets/"
          cp po/*.po "$APP/Contents/Resources/po/"
          cp -R assets/lproj/*.lproj "$APP/Contents/Resources/"
          # Bundle all non-system dylibs recursively
          bundle_dylib() {
            local binary="$1"
            otool -L "$binary" | awk 'NR>1{print $1}' | while read -r ref; do
              case "$ref" in
                /usr/lib/*|/System/*|@executable_path/*|@rpath/*|@loader_path/*) continue ;;
              esac
              local name=$(basename "$ref")
              local dest="$APP/Contents/Frameworks/$name"
              if [ ! -f "$dest" ]; then
                cp "$ref" "$dest"
                chmod 644 "$dest"
                install_name_tool -id "@executable_path/../Frameworks/$name" "$dest"
                bundle_dylib "$dest"
              fi
              install_name_tool -change "$ref" "@executable_path/../Frameworks/$name" "$binary"
            done
          }
          bundle_dylib "$APP/Contents/MacOS/OpenCaptive"
          # Also fix cross-references between bundled frameworks
          for fw in "$APP/Contents/Frameworks/"*.dylib; do
            bundle_dylib "$fw"
          done
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string OpenCaptive" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string se.danielnylander.opencaptive" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string OpenCaptive" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 14.0" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string OpenCaptive" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string en" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$APP/Contents/Info.plist"
          idx=0
          for lang in en sv da de es fi fr hu it ja ko nl no pl pt ro ru cs zh; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:$idx string $lang" "$APP/Contents/Info.plist"
            idx=$((idx + 1))
          done
          codesign --force --deep -s - "$APP"
      - name: Create DMG
        run: |
          hdiutil create -volname OpenCaptive -srcfolder OpenCaptive.app \
            -ov -format UDZO OpenCaptive-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: OpenCaptive-macos-arm64.dmg

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Install zlib
        run: |
          git clone --depth 1 https://github.com/madler/zlib.git zlib-src
          cmake -S zlib-src -B zlib-build -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/zlib-install
          cmake --build zlib-build --config Release
          cmake --install zlib-build --config Release
      - name: Install SDL3
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL3-src
          cmake -S SDL3-src -B SDL3-build -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/SDL3-install
          cmake --build SDL3-build --config Release
          cmake --install SDL3-build --config Release
      - name: Install SDL3_ttf
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/libsdl-org/SDL_ttf.git SDL3_ttf-src
          cmake -S SDL3_ttf-src -B SDL3_ttf-build -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/SDL3_ttf-install -DCMAKE_PREFIX_PATH=${{ github.workspace }}/SDL3-install
          cmake --build SDL3_ttf-build --config Release
          cmake --install SDL3_ttf-build --config Release
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/SDL3-install;${{ github.workspace }}/SDL3_ttf-install;${{ github.workspace }}/zlib-install" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Test
        run: |
          $env:PATH = "${{ github.workspace }}/SDL3-install/bin;${{ github.workspace }}/SDL3_ttf-install/bin;${{ github.workspace }}/zlib-install/bin;$env:PATH"
          ctest --test-dir build -C Release -j4 --output-on-failure -E "map_gen|captive_view_window|liberation_text_table|liberation_x3g|custom_features|game_state|save_load"
      - name: Get version
        id: version
        shell: bash
        run: echo "version=${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Create Inno Setup script
        shell: cmd
        run: |
          mkdir dist
          mkdir dist\data
          mkdir dist\po
          mkdir dist\assets
          copy build\Release\opencaptive.exe dist\
          copy ${{ github.workspace }}\SDL3-install\bin\SDL3.dll dist\
          copy ${{ github.workspace }}\SDL3_ttf-install\bin\SDL3_ttf.dll dist\
          copy ${{ github.workspace }}\zlib-install\bin\zlib.dll dist\ 2>nul || copy ${{ github.workspace }}\zlib-install\bin\zlib1.dll dist\ 2>nul || echo No zlib DLL found
          copy data\DejaVuSansMono-Bold.ttf dist\data\
          xcopy /E /I /Y assets\menu dist\assets\menu
          copy po\*.po dist\po\
          copy README.md dist\
          copy LICENSE dist\
          copy assets\icon.ico dist\
          (
          echo [Setup]
          echo AppName=OpenCaptive
          echo SetupIconFile=dist\icon.ico
          echo AppVersion=${{ steps.version.outputs.version }}
          echo AppPublisher=Daniel Nylander
          echo AppPublisherURL=https://github.com/yeager/OpenCaptive
          echo DefaultDirName={autopf}\OpenCaptive
          echo DefaultGroupName=OpenCaptive
          echo OutputDir=installer
          echo OutputBaseFilename=OpenCaptive-${{ steps.version.outputs.version }}-setup-x64
          echo Compression=lzma2
          echo SolidCompression=yes
          echo ArchitecturesAllowed=x64compatible
          echo ArchitecturesInstallIn64BitMode=x64compatible
          echo [Files]
          echo Source: "dist\opencaptive.exe"; DestDir: "{app}"; Flags: ignoreversion
          echo Source: "dist\SDL3.dll"; DestDir: "{app}"; Flags: ignoreversion
          echo Source: "dist\SDL3_ttf.dll"; DestDir: "{app}"; Flags: ignoreversion
          echo Source: "dist\zlib*.dll"; DestDir: "{app}"; Flags: ignoreversion skipifsourcedoesntexist
          echo Source: "dist\data\*"; DestDir: "{app}\data"; Flags: ignoreversion
          echo Source: "dist\po\*"; DestDir: "{app}\po"; Flags: ignoreversion
          echo Source: "dist\README.md"; DestDir: "{app}"; Flags: ignoreversion
          echo Source: "dist\LICENSE"; DestDir: "{app}"; Flags: ignoreversion
          echo Source: "dist\icon.ico"; DestDir: "{app}"; Flags: ignoreversion
          echo [Icons]
          echo Name: "{group}\OpenCaptive"; Filename: "{app}\opencaptive.exe"; IconFilename: "{app}\icon.ico"
          echo Name: "{group}\Uninstall OpenCaptive"; Filename: "{uninstallexe}"
          echo Name: "{commondesktop}\OpenCaptive"; Filename: "{app}\opencaptive.exe"; IconFilename: "{app}\icon.ico"; Tasks: desktopicon
          echo [Tasks]
          echo Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"
          echo [Run]
          echo Filename: "{app}\opencaptive.exe"; Description: "Launch OpenCaptive"; Flags: nowait postinstall skipifsilent
          ) > setup.iss
      - name: Build installer
        run: iscc setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: installer/OpenCaptive-*.exe

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: brew install cmake ninja librsvg
      - name: Build SDL3 for iOS
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL3-src
          cmake -S SDL3-src -B SDL3-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/SDL3-ios \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON
          ninja -C SDL3-ios-build
          ninja -C SDL3-ios-build install
      - name: Build freetype for iOS
        run: |
          git clone --depth 1 https://github.com/freetype/freetype.git freetype-src
          cmake -S freetype-src -B freetype-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/freetype-ios \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_BROTLI=ON
          ninja -C freetype-ios-build
          ninja -C freetype-ios-build install
      - name: Build SDL3_ttf for iOS
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL_ttf.git SDL3_ttf-src
          # Remove GL text engine - iOS doesn't have desktop OpenGL headers
          sed -i '' '/SDL_gl_textengine\.c/d' SDL3_ttf-src/CMakeLists.txt
          cmake -S SDL3_ttf-src -B SDL3_ttf-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/SDL3_ttf-ios \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/SDL3-ios;${{ github.workspace }}/freetype-ios" \
            -DCMAKE_FIND_ROOT_PATH="${{ github.workspace }}/SDL3-ios;${{ github.workspace }}/freetype-ios" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDLTTF_SAMPLES=OFF \
            -DSDLTTF_VENDORED=OFF \
            -DSDLTTF_HARFBUZZ=OFF \
            -DSDLTTF_PLUTOSVG=OFF \
            -DBUILD_SHARED_LIBS=OFF
          ninja -C SDL3_ttf-ios-build
          ninja -C SDL3_ttf-ios-build install
      - name: Build zlib for iOS
        run: |
          git clone --depth 1 https://github.com/madler/zlib.git zlib-src
          cmake -S zlib-src -B zlib-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/zlib-ios \
            -DCMAKE_BUILD_TYPE=Release
          ninja -C zlib-ios-build
          ninja -C zlib-ios-build install
      - name: Build OpenCaptive for iOS
        run: |
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/SDL3-ios;${{ github.workspace }}/SDL3_ttf-ios;${{ github.workspace }}/freetype-ios;${{ github.workspace }}/zlib-ios" \
            -DCMAKE_FIND_ROOT_PATH="${{ github.workspace }}/SDL3-ios;${{ github.workspace }}/SDL3_ttf-ios;${{ github.workspace }}/freetype-ios;${{ github.workspace }}/zlib-ios" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cc \
            -DBUILD_TESTING=OFF
          ninja -C build-ios opencaptive
      - name: Create .app and .ipa
        run: |
          VERSION=${RELEASE_VERSION#v}
          APP=Payload/OpenCaptive.app
          mkdir -p "$APP/data" "$APP/po"
          mkdir -p "$APP/assets"
          # Find the built binary (cmake may place it in various locations)
          BINARY=$(find build-ios -name "opencaptive" -type f -not -path "*/CMakeFiles/*" | head -1)
          echo "Found binary at: $BINARY"
          ls -la build-ios/opencaptive* 2>/dev/null || true
          cp "$BINARY" "$APP/OpenCaptive"
          cp data/DejaVuSansMono-Bold.ttf "$APP/data/"
          cp -R assets/menu "$APP/assets/"
          cp po/*.po "$APP/po/"
          sed "s/\$(VERSION)/$VERSION/g" assets/Info-iOS.plist > "$APP/Info.plist"
          # Compile LaunchScreen storyboard
          ibtool --compile "$APP/LaunchScreen.storyboardc" assets/LaunchScreen.storyboard \
            --target-device iphone --target-device ipad \
            --minimum-deployment-target 15.0 || true
          # Generate app icons
          for size in 40 60 76 84 1024; do
            rsvg-convert -w $size -h $size assets/icon.svg -o "$APP/AppIcon${size}x${size}.png" 2>/dev/null || true
          done
          # Ad-hoc sign (required for AltStore sideloading)
          codesign --force --deep -s - "$APP"
          # Create .ipa
          zip -r OpenCaptive-ios-arm64.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: OpenCaptive-ios-arm64.ipa

  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build librsvg2-bin
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Build SDL3 for Android
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL3-src
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S SDL3-src -B SDL3-android-$abi -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-24 \
              -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/SDL3-android/$abi \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF
            ninja -C SDL3-android-$abi
            ninja -C SDL3-android-$abi install
          done
      - name: Build SDL3_ttf for Android
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/libsdl-org/SDL_ttf.git SDL3_ttf-src
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S SDL3_ttf-src -B SDL3_ttf-android-$abi -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-24 \
              -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/SDL3_ttf-android/$abi \
              -DCMAKE_PREFIX_PATH=${{ github.workspace }}/SDL3-android/$abi \
              -DCMAKE_FIND_ROOT_PATH=${{ github.workspace }}/SDL3-android/$abi \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDLTTF_SAMPLES=OFF \
              -DSDLTTF_VENDORED=ON \
              -DSDLTTF_HARFBUZZ=OFF \
              -DSDLTTF_PLUTOSVG=OFF
            ninja -C SDL3_ttf-android-$abi
            ninja -C SDL3_ttf-android-$abi install
          done
      - name: Build zlib for Android
        run: |
          git clone --depth 1 https://github.com/madler/zlib.git zlib-src
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S zlib-src -B zlib-android-$abi -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-24 \
              -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/zlib-android/$abi \
              -DCMAKE_BUILD_TYPE=Release
            ninja -C zlib-android-$abi
            ninja -C zlib-android-$abi install
          done
      - name: Build OpenCaptive for Android
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S . -B build-android-$abi -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-24 \
              -DCMAKE_PREFIX_PATH="${{ github.workspace }}/SDL3-android/$abi;${{ github.workspace }}/SDL3_ttf-android/$abi;${{ github.workspace }}/zlib-android/$abi" \
              -DCMAKE_FIND_ROOT_PATH="${{ github.workspace }}/SDL3-android/$abi;${{ github.workspace }}/SDL3_ttf-android/$abi;${{ github.workspace }}/zlib-android/$abi" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DCMAKE_SHARED_LINKER_FLAGS="-u SDL_main"
            ninja -C build-android-$abi opencaptive
          done
      - name: Create Gradle project and build APK
        run: |
          VERSION=${RELEASE_VERSION#v}
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')

          mkdir -p apk-project/app/src/main/java/se/danielnylander/opencaptive
          mkdir -p apk-project/app/src/main/res/values
          mkdir -p apk-project/app/src/main/res/mipmap-xxxhdpi
          mkdir -p apk-project/app/src/main/assets/data
          mkdir -p apk-project/app/src/main/assets/po
          mkdir -p apk-project/app/src/main/assets/assets

          # Copy game resources to APK assets
          cp data/DejaVuSansMono-Bold.ttf apk-project/app/src/main/assets/data/
          cp -R assets/menu apk-project/app/src/main/assets/assets/
          cp po/*.po apk-project/app/src/main/assets/po/

          # Copy native libs
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p apk-project/app/src/main/jniLibs/$abi
            cp build-android-$abi/libopencaptive.so apk-project/app/src/main/jniLibs/$abi/libmain.so 2>/dev/null || \
              cp build-android-$abi/opencaptive apk-project/app/src/main/jniLibs/$abi/libmain.so
            cp ${{ github.workspace }}/SDL3-android/$abi/lib/libSDL3.so apk-project/app/src/main/jniLibs/$abi/
            cp ${{ github.workspace }}/SDL3_ttf-android/$abi/lib/libSDL3_ttf.so apk-project/app/src/main/jniLibs/$abi/
          done

          # Copy SDL Java sources
          cp -r SDL3-src/android-project/app/src/main/java/org apk-project/app/src/main/java/

          # Generate app icon from SVG
          rsvg-convert -w 192 -h 192 assets/icon.svg -o apk-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || \
            python3 -c "
          import struct, zlib
          w=h=192
          raw=b''
          for y in range(h):
              raw+=b'\x00'+(b'\x33\x66\x99\xff')*w
          def chunk(t,d):return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          with open('apk-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png','wb') as f:
              f.write(b'\x89PNG\r\n\x1a\n')
              f.write(chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0)))
              f.write(chunk(b'IDAT',zlib.compress(raw)))
              f.write(chunk(b'IEND',b''))
          "

          # AndroidManifest.xml
          cp assets/AndroidManifest.xml apk-project/app/src/main/AndroidManifest.xml

          # Strings
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <string name="app_name">OpenCaptive</string>' '</resources>' > apk-project/app/src/main/res/values/strings.xml

          # settings.gradle with plugin management
          python3 -c "
          import textwrap
          settings = textwrap.dedent('''
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = \"OpenCaptive\"
          include ':app'
          ''').strip()
          with open('apk-project/settings.gradle', 'w') as f:
              f.write(settings + '\n')
          "
          printf '%s\n' 'plugins {' "    id 'com.android.application' version '8.2.0' apply false" '}' > apk-project/build.gradle

          # App build.gradle
          python3 -c "
          import textwrap
          gradle = textwrap.dedent('''
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'se.danielnylander.opencaptive'
              compileSdk 34
              defaultConfig {
                  applicationId \"se.danielnylander.opencaptive\"
                  minSdk 24
                  targetSdk 34
                  versionCode $VERSION_CODE
                  versionName \"$VERSION\"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              sourceSets {
                  main {
                      jniLibs.srcDirs = ['src/main/jniLibs']
                  }
              }
          }
          ''').strip()
          with open('apk-project/app/build.gradle', 'w') as f:
              f.write(gradle + '\n')
          "
          echo 'android.useAndroidX=true' > apk-project/gradle.properties

          # Build APK
          cd apk-project
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleRelease
          cd ..

          # Copy APK
          find apk-project -name "*.apk" -exec cp {} OpenCaptive-android.apk \;
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: OpenCaptive-android.apk
          if-no-files-found: error

  create-release:
    needs: [build-linux, build-linux-appimage, build-macos, build-windows, build-ios, build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=${RELEASE_VERSION#v}
          case "$PACKAGE_VERSION" in
            ''|*[!0-9.]*) echo "Invalid release version: $RELEASE_VERSION" >&2; exit 1 ;;
          esac
          test -s artifacts/linux-x86_64/opencaptive-linux-x86_64.tar.gz
          test -s artifacts/linux-x86_64/opencaptive_*.deb
          test -s artifacts/linux-x86_64/opencaptive-*.rpm
          test -s artifacts/linux-appimage/opencaptive-x86_64.AppImage
          test -s artifacts/macos-arm64/OpenCaptive-macos-arm64.dmg
          test -s artifacts/windows-x64/OpenCaptive-*.exe
          test -s artifacts/ios-arm64/OpenCaptive-ios-arm64.ipa
          test -s artifacts/android/OpenCaptive-android.apk
      - name: Extract version-specific release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${RELEASE_VERSION#v}
          awk -v version="$VERSION" '
            index($0, "## v" version " ") == 1 { found = 1 }
            found && /^## v[0-9]/ && index($0, "## v" version " ") != 1 { exit }
            found { print }
            END {
              if (!found) {
                print "Missing human-written release notes for v" version > "/dev/stderr"
                exit 1
              }
            }
          ' RELEASE_NOTES.md > release-notes.md
          test -s release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: OpenCaptive ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            artifacts/linux-x86_64/opencaptive-linux-x86_64.tar.gz
            artifacts/linux-x86_64/opencaptive_*.deb
            artifacts/linux-x86_64/opencaptive-*.rpm
            artifacts/linux-appimage/opencaptive-x86_64.AppImage
            artifacts/macos-arm64/OpenCaptive-macos-arm64.dmg
            artifacts/windows-x64/OpenCaptive-*.exe
            artifacts/ios-arm64/OpenCaptive-ios-arm64.ipa
            artifacts/android/OpenCaptive-android.apk
          body_path: release-notes.md
          generate_release_notes: false

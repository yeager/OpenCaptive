name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev libfreetype-dev libharfbuzz-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdecor-0-dev libegl-dev libgles-dev libgl-dev libdrm-dev \
            libgbm-dev libpulse-dev libasound2-dev
      - name: Build SDL3
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/libsdl-org/SDL.git SDL3-src
          cmake -S SDL3-src -B SDL3-build -DCMAKE_INSTALL_PREFIX=/usr/local -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          ninja -C SDL3-build
          sudo ninja -C SDL3-build install
          sudo ldconfig
      - name: Build SDL3_ttf
        run: |
          git clone --depth 1 --filter=blob:none --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_ttf.git SDL3_ttf-src
          cmake -S SDL3_ttf-src -B SDL3_ttf-build -DCMAKE_INSTALL_PREFIX=/usr/local -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C SDL3_ttf-build
          sudo ninja -C SDL3_ttf-build install
          sudo ldconfig
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=cc -G Ninja
          ninja -C build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure -E "liberation_img|liberation_text_table"

  build-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install cmake ninja sdl3 sdl3_ttf
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=cc -G Ninja
          ninja -C build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure -E "liberation_img|liberation_x3g"

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install zlib
        run: |
          git clone --depth 1 https://github.com/madler/zlib.git zlib-src
          cmake -S zlib-src -B zlib-build -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/zlib-install
          cmake --build zlib-build --config Release
          cmake --install zlib-build --config Release
      - name: Install SDL3
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/libsdl-org/SDL.git SDL3-src
          cmake -S SDL3-src -B SDL3-build -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/SDL3-install -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build SDL3-build --config Release
          cmake --install SDL3-build --config Release
      - name: Install SDL3_ttf
        run: |
          git clone --depth 1 --filter=blob:none --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_ttf.git SDL3_ttf-src
          cmake -S SDL3_ttf-src -B SDL3_ttf-build -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/SDL3_ttf-install -DCMAKE_PREFIX_PATH=${{ github.workspace }}/SDL3-install
          cmake --build SDL3_ttf-build --config Release
          cmake --install SDL3_ttf-build --config Release
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/SDL3-install;${{ github.workspace }}/SDL3_ttf-install;${{ github.workspace }}/zlib-install"
          cmake --build build --config Release
      - name: Test
        run: |
          $env:PATH = "${{ github.workspace }}/SDL3-install/bin;${{ github.workspace }}/SDL3_ttf-install/bin;${{ github.workspace }}/zlib-install/bin;$env:PATH"
          ctest --test-dir build -C Release -j4 --output-on-failure -E "map_gen|captive_view_window|liberation_text_table|liberation_x3g|custom_features|game_state|save_load"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00aa44"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#556677"/>
      <stop offset="100%" stop-color="#334455"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  <!-- Grid lines (dungeon floor) -->
  <g opacity="0.15" stroke="#00ff88" stroke-width="1">
    <line x1="0" y1="420" x2="512" y2="420"/>
    <line x1="0" y1="460" x2="512" y2="460"/>
    <line x1="0" y1="500" x2="512" y2="500"/>
    <line x1="60" y1="380" x2="0" y2="512"/>
    <line x1="160" y1="380" x2="80" y2="512"/>
    <line x1="256" y1="380" x2="256" y2="512"/>
    <line x1="352" y1="380" x2="432" y2="512"/>
    <line x1="452" y1="380" x2="512" y2="512"/>
  </g>
  <!-- Droid body -->
  <rect x="176" y="180" width="160" height="200" rx="16" fill="url(#body)" stroke="#667788" stroke-width="3"/>
  <!-- Droid head -->
  <rect x="186" y="110" width="140" height="80" rx="12" fill="url(#body)" stroke="#667788" stroke-width="3"/>
  <!-- Antenna -->
  <line x1="256" y1="110" x2="256" y2="70" stroke="#667788" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="64" r="8" fill="#00ff88">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Eyes -->
  <rect x="210" y="130" width="30" height="16" rx="4" fill="#ff3333">
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="272" y="130" width="30" height="16" rx="4" fill="#ff3333">
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Chest panel -->
  <rect x="206" y="210" width="100" height="60" rx="6" fill="#1a1a2e" stroke="#00ff88" stroke-width="2"/>
  <!-- Chest display lines -->
  <line x1="216" y1="225" x2="276" y2="225" stroke="#00ff88" stroke-width="2" opacity="0.8"/>
  <line x1="216" y1="237" x2="260" y2="237" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
  <line x1="216" y1="249" x2="268" y2="249" stroke="#00ff88" stroke-width="2" opacity="0.5"/>
  <line x1="216" y1="261" x2="246" y2="261" stroke="#00ff88" stroke-width="2" opacity="0.4"/>
  <!-- Arms -->
  <rect x="140" y="200" width="36" height="120" rx="10" fill="url(#body)" stroke="#667788" stroke-width="2"/>
  <rect x="336" y="200" width="36" height="120" rx="10" fill="url(#body)" stroke="#667788" stroke-width="2"/>
  <!-- Hands/claws -->
  <rect x="144" y="310" width="12" height="24" rx="4" fill="#667788"/>
  <rect x="160" y="310" width="12" height="24" rx="4" fill="#667788"/>
  <rect x="340" y="310" width="12" height="24" rx="4" fill="#667788"/>
  <rect x="356" y="310" width="12" height="24" rx="4" fill="#667788"/>
  <!-- Legs -->
  <rect x="196" y="380" width="40" height="70" rx="8" fill="url(#body)" stroke="#667788" stroke-width="2"/>
  <rect x="276" y="380" width="40" height="70" rx="8" fill="url(#body)" stroke="#667788" stroke-width="2"/>
  <!-- Feet -->
  <rect x="186" y="440" width="60" height="20" rx="6" fill="#445566"/>
  <rect x="266" y="440" width="60" height="20" rx="6" fill="#445566"/>
  <!-- Title text -->
  <text x="256" y="498" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="28" fill="#00ff88" opacity="0.9">OPENCAPTIVE</text>
</svg>
